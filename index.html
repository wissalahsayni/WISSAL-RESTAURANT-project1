<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="images/logo.png" />

    <title>WISSAL Restaurant</title>
  </head>

  <body>
    <!-- HEADER / NAVBAR -->
    <header class="header">
      <nav class="navbar">
        <div class="logo">
          <a href="#home">
            <img src="images/logo.png" alt="Wissal Restaurant Logo" />
          </a>
        </div>

        <div class="nav-links">
          <a href="#home">Home</a>
          <a href="#menu">Menu</a>
          <a href="#about">About</a>
          <a href="#contact">Contact</a>
        </div>

        <div class="nav-btn">
          <button type="button">Book a Table</button>
        </div>
      </nav>
    </header>

    <!-- HOME SECTION -->
    <main>
      <section class="home" id="home">
        <div class="home-content">
          <p class="home-subtitle">WELCOME TO WISSAL RESTAURANT</p>

          <h1>Discover the Taste of Perfection</h1>

          <p class="home-description">
            Delicious food, beautiful moments, and unforgettable experiences.
          </p>

          <div class="home-btn">
            <a href="#menu">Explore Our Menu</a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
